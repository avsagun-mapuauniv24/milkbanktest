<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Makati Milk Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <!-- Background Gradient -->
    <div class="login-bg-blur"></div>

    <!-- Login Card -->
    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">🥛</div>

      <!-- Title -->
      <h1 class="login-title">Makati Milk Bank</h1>
      <p class="login-subtitle">Inventory Management System</p>

      <!-- Form -->
      <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="admin@makatimilkbank.org"
            required
            autocomplete="email"
          />
          <span class="form-error" id="emailError"></span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input password-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button
              type="button"
              id="togglePassword"
              class="password-toggle"
              title="Toggle password visibility"
              aria-label="Toggle password visibility"
            >
              <span class="toggle-icon">👁️</span>
            </button>
          </div>
          <span class="form-error" id="passwordError"></span>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-row">
          <label class="checkbox-label">
            <input
              type="checkbox"
              id="rememberMe"
              name="rememberMe"
              class="checkbox-input"
            />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-password-link">Forgot password?</a>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="loginError"></div>

        <!-- Login Button -->
        <button type="submit" class="btn-login" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader"></span>
        </button>
      </form>

      <!-- Demo Credentials -->
      <div class="demo-credentials">
        <p class="demo-title">Demo Credentials</p>
        <div class="demo-item">
          <span class="demo-label">Email:</span>
          <code class="demo-value">admin@makatimilkbank.org</code>
        </div>
        <div class="demo-item">
          <span class="demo-label">Password:</span>
          <code class="demo-value">admin123</code>
        </div>
      </div>

      <!-- Footer -->
      <p class="login-footer">
        © 2026 Makati Milk Bank System. All rights reserved.
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="auth.js"></script>
</body>
</html>
